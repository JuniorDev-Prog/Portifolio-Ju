<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevLinks — Junior</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="profile">
        <img
          src="./assets/avatar.png"
          alt="Foto de Junior usando óculos sem aro e camiseta escura."
        />
        <p>@juniordev-prog</p>
      </div>

      <div id="switch" onclick="toggleMode()" role="button" aria-label="Alternar tema claro e escuro">
        <button type="button" aria-label="Alternar tema"></button>
        <span></span>
      </div>

      <ul>
        <li>
          <a href="https://github.com/JuniorDev-Prog" target="_blank" rel="noopener noreferrer">
            Ver meu GitHub
          </a>
        </li>

        <li>
          <a href="https://juniordev-prog.github.io/PROJETO-FOOD/" target="_blank" rel="noopener noreferrer">
            Projeto Food — Site ao Vivo
          </a>
        </li>

        <li>
          <a href="https://github.com/JuniorDev-Prog/Dashboard-porscher-sales" target="_blank" rel="noopener noreferrer">
            Porsche Sales Intelligence
          </a>
        </li>

        <li>
          <a href="https://bento.me/junior-dev" target="_blank" rel="noopener noreferrer">
            Meus Links no Bento
          </a>
        </li>
      </ul>

      <div id="social-links">
        <a href="https://github.com/JuniorDev-Prog" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <ion-icon name="logo-github"></ion-icon>
        </a>

        <a href="https://www.linkedin.com/in/junior-dev/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <ion-icon name="logo-linkedin"></ion-icon>
        </a>

        <a href="https://bento.me/junior-dev" target="_blank" rel="noopener noreferrer" aria-label="Portfólio">
          <ion-icon name="globe-outline"></ion-icon>
        </a>
      </div>

      <footer>
        Feito por <a href="https://github.com/JuniorDev-Prog" target="_blank" rel="noopener noreferrer">Junior.Dev</a>
      </footer>
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>

    <script src="./script.js"></script>
  </body>
</html>
